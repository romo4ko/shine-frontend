name: shine
description: Сияние

publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.2.0
  flutter_svg: ^2.0.9
  masked_text: ^1.1.2
  path_provider: ^2.1.2
  image_picker: ^1.1.1
  flutter_xlider: ^3.5.0
  flutter_card_swiper: ^7.0.0
  keyboard_attachable: ^2.2.0
  dio: ^5.4.2+1
  shared_preferences: ^2.2.3
  yookassa_payments_flutter: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/shine-logo-main.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  web:
    generate: true
    image_path: "assets/images/shine-logo-main.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/shine-logo-main.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/shine-logo-main.png"

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/test/
    - assets/icons/add-image.svg
    - assets/icons/arrow-back.svg
    - assets/icons/star-bot.svg
    - assets/icons/heart.svg
    - assets/icons/cards.svg
    - assets/icons/chats.svg
    - assets/icons/human.svg
    - assets/icons/options.svg
    - assets/icons/back-button.svg
    - assets/icons/dislike.svg
    - assets/icons/like.svg
    - assets/icons/message.svg
    - assets/icons/star.svg
    - assets/icons/filter.svg
    - assets/icons/settings.svg
    - assets/icons/invites/send-link.svg
    - assets/icons/invites/invite-star-1.svg
    - assets/icons/invites/invite-star-2.svg
    - assets/icons/invites/invite-star-3.svg
    - assets/icons/arrow-bottom.svg
    - assets/icons/bot-settings-star.svg
    - assets/icons/drawed-arrow.svg
    - assets/icons/seen.svg
    - assets/icons/send.svg
    - assets/icons/clip.svg
    - assets/icons/likes-heart.svg
    - assets/icons/arrow-right.svg
    - assets/icons/premium-main.svg
    - assets/icons/additional/smoking.svg
    - assets/icons/additional/alcohol.svg
    - assets/icons/additional/children.svg
    - assets/icons/additional/height.svg
    - assets/icons/additional/education.svg
    - assets/icons/additional/city.svg
    - assets/icons/additional/purpose.svg
    - assets/icons/additional/fs.svg
    - assets/icons/additional/sign.svg

  fonts:
   - family: Dejavu
     fonts:
       - asset: assets/fonts/Dejavu.otf
   - family: Montserrat
     fonts:
       - asset: assets/fonts/MontserratAlternates.ttf
   - family: kistyac
     fonts:
       - asset: assets/fonts/kistyac.otf
   - family: Krub
     fonts:
       - asset: assets/fonts/Krub/Krub-Regular.ttf
   - family: Inter
     fonts:
       - asset: assets/fonts/Inter/Inter-Regular.ttf

